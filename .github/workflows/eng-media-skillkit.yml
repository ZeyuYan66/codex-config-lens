name: Verify offline installer
on:
  push:
    paths:
      - 'eng-media-skillkit/**'
      - '.github/workflows/eng-media-skillkit.yml'
  pull_request:
    paths:
      - 'eng-media-skillkit/**'
      - '.github/workflows/eng-media-skillkit.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  install:
    defaults:
      run:
        working-directory: eng-media-skillkit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/render_catalog.py --check
      - run: python tools/render_sources.py --check
      - run: python tools/render_english.py --check
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_release.py 1.0.1 --output build-check
